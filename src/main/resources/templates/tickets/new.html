<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo chamado — FieldService</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}"></script>
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="fs-navbar">
        <div class="container d-flex align-items-center justify-content-between">
            <a th:href="@{/inicio}" class="fs-brand">
                <div class="fs-brand-icon-sm"><i class="bi bi-tools"></i></div>
                <span>FieldService</span>
            </a>

            <nav class="d-none d-md-block">
                <ul class="fs-nav-links">
                    <li><a th:href="@{/inicio}" class="fs-nav-link"><i class="bi bi-house-door"></i><span>Início</span></a></li>
                    <li><a th:href="@{/chamados}" class="fs-nav-link active"><i class="bi bi-ticket-detailed"></i><span>Chamados</span></a></li>
                    <li><a th:href="@{/perfil}" class="fs-nav-link"><i class="bi bi-person"></i><span>Perfil</span></a></li>
                </ul>
            </nav>

            <div class="d-flex align-items-center gap-3">
                <div class="dropdown">
                    <button class="fs-btn fs-btn-outline py-1 px-2" type="button" id="themeDropdown"
                            data-bs-toggle="dropdown" aria-expanded="false" title="Alternar Tema">
                        <i class="bi bi-palette-fill"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end fs-modal-content p-2" aria-labelledby="themeDropdown">
                        <li><button class="dropdown-item rounded-2 d-flex align-items-center gap-2 py-2" type="button" onclick="setFieldServiceTheme('dark')"><i class="bi bi-moon-stars-fill text-primary"></i><span>Escuro (Padrão)</span></button></li>
                        <li><button class="dropdown-item rounded-2 d-flex align-items-center gap-2 py-2" type="button" onclick="setFieldServiceTheme('light')"><i class="bi bi-sun-fill text-warning"></i><span>Claro</span></button></li>
                        <li><button class="dropdown-item rounded-2 d-flex align-items-center gap-2 py-2" type="button" onclick="setFieldServiceTheme('super-dark')"><i class="bi bi-circle-fill text-secondary"></i><span>Super Dark (AMOLED)</span></button></li>
                    </ul>
                </div>

                <div class="dropdown">
                    <button class="fs-avatar border-0 p-0" type="button" id="userMenuDropdown"
                            data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">
                        <span th:text="${technician.initials}">JS</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end fs-modal-content p-2" aria-labelledby="userMenuDropdown">
                        <li class="px-3 py-2 border-bottom border-secondary border-opacity-25 mb-1">
                            <div class="fw-bold" th:text="${technician.name}">João Silva</div>
                            <div class="small text-secondary-fs" th:text="${technician.email}">tecnico@fieldservice.com</div>
                        </li>
                        <li><a class="dropdown-item rounded-2 d-flex align-items-center gap-2 py-2" th:href="@{/perfil}"><i class="bi bi-person"></i><span>Meu Perfil</span></a></li>
                        <li><hr class="dropdown-divider border-secondary border-opacity-25"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="dropdown-item rounded-2 d-flex align-items-center gap-2 py-2 text-danger"><i class="bi bi-box-arrow-right"></i><span>Sair</span></button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="fs-main-content">
        <div class="container" style="max-width: 760px;">
            <!-- Voltar -->
            <div class="mb-3">
                <a th:href="@{/chamados}" class="text-secondary-fs text-decoration-none d-inline-flex align-items-center gap-2 small fw-semibold">
                    <i class="bi bi-arrow-left"></i>
                    <span>Voltar para chamados</span>
                </a>
            </div>

            <!-- Header da página -->
            <div class="mb-4">
                <h1 class="h2 fw-bold mb-1 d-flex align-items-center gap-2">
                    <i class="bi bi-plus-circle-fill text-primary"></i>
                    <span>Novo chamado</span>
                </h1>
                <p class="text-secondary-fs mb-0">Cadastre manualmente um atendimento. Ele será atribuído a você.</p>
            </div>

            <!-- Mensagem de erro de validação -->
            <div th:if="${errorMessage}" class="fs-alert fs-alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                <span th:text="${errorMessage}">Preencha todos os campos.</span>
            </div>

            <!-- Formulário -->
            <div class="fs-card">
                <form th:action="@{/chamados/novo}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="title" class="fs-form-label">Título do problema</label>
                        <input type="text" class="fs-input" id="title" name="title"
                               th:value="${fTitle}" placeholder="Ex.: Servidor indisponível" required />
                    </div>

                    <div class="row g-3">
                        <div class="col-12 col-md-6 mb-3">
                            <label for="customerName" class="fs-form-label">Cliente</label>
                            <input type="text" class="fs-input" id="customerName" name="customerName"
                                   th:value="${fCustomerName}" placeholder="Ex.: Empresa XYZ" required />
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label for="address" class="fs-form-label">Endereço / Localização</label>
                            <input type="text" class="fs-input" id="address" name="address"
                                   th:value="${fAddress}" placeholder="Ex.: Brasília - DF" required />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="priority" class="fs-form-label">Prioridade</label>
                        <select class="fs-input" id="priority" name="priority" required>
                            <option value="" disabled th:selected="${fPriority == null}">Selecione a prioridade…</option>
                            <option th:each="p : ${priorities}"
                                    th:value="${p.name()}"
                                    th:text="${p.description}"
                                    th:selected="${fPriority != null and fPriority == p.name()}">Alta</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="fs-form-label">Descrição detalhada</label>
                        <textarea class="fs-input" id="description" name="description" rows="4"
                                  placeholder="Descreva o problema relatado pelo cliente…" required
                                  th:text="${fDescription}"></textarea>
                    </div>

                    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">
                        <a th:href="@{/chamados}" class="fs-btn fs-btn-outline">
                            <i class="bi bi-x-lg"></i>
                            <span>Cancelar</span>
                        </a>
                        <button type="submit" class="fs-btn fs-btn-primary">
                            <i class="bi bi-check2-circle"></i>
                            <span>Cadastrar chamado</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="fs-bottom-nav">
        <a th:href="@{/inicio}" class="fs-bottom-nav-item"><i class="bi bi-house-door"></i><span>Início</span></a>
        <a th:href="@{/chamados}" class="fs-bottom-nav-item active"><i class="bi bi-ticket-detailed"></i><span>Chamados</span></a>
        <a th:href="@{/perfil}" class="fs-bottom-nav-item"><i class="bi bi-person"></i><span>Perfil</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
