<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FieldService</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- FieldService Design System Tokens and Custom Styles -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}"></script>
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: radial-gradient(circle at top center, rgba(76, 141, 255, 0.08) 0%, transparent 60%), var(--fs-bg);
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            background-color: var(--fs-card);
            border: 1px solid var(--fs-outline);
            border-radius: var(--fs-radius-card);
            box-shadow: var(--fs-shadow-card);
        }
        .app-brand-icon {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--fs-primary), #2b6ad4);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1.25rem auto;
            box-shadow: var(--fs-shadow-glow);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="app-brand-icon">
                    <i class="bi bi-tools"></i>
                </div>
                <h1 class="h3 fw-bold mb-1">FieldService</h1>
                <p class="text-secondary-fs mb-0">Gestão de atendimentos em campo</p>
            </div>

            <!-- Mensagem de Erro de Validação/Credenciais (RN002) -->
            <div th:if="${errorMessage}" class="fs-alert fs-alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                <span th:text="${errorMessage}">E-mail ou senha inválidos</span>
            </div>

            <!-- Mensagem de Logout (RN003) -->
            <div th:if="${logoutMessage}" class="fs-alert fs-alert-success" role="alert">
                <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                <span th:text="${logoutMessage}">Sessão encerrada com sucesso.</span>
            </div>

            <!-- Mensagem de Cadastro concluído -->
            <div th:if="${successMessage}" class="fs-alert fs-alert-success" role="alert">
                <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                <span th:text="${successMessage}">Conta criada com sucesso!</span>
            </div>

            <form th:action="@{/login}" method="post" id="loginForm" novalidate>
                <!-- CSRF Token (automático com Thymeleaf) -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label for="username" class="fs-form-label">E-mail</label>
                    <div class="position-relative">
                        <input type="email"
                               class="fs-input"
                               id="username"
                               name="username"
                               placeholder="tecnico@fieldservice.com"
                               required
                               autocomplete="email"
                               autofocus />
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="fs-form-label">Senha</label>
                    <div class="position-relative">
                        <input type="password"
                               class="fs-input"
                               id="password"
                               name="password"
                               placeholder="••••••"
                               required
                               autocomplete="current-password" />
                    </div>
                </div>

                <button type="submit" class="fs-btn fs-btn-primary fs-btn-block" id="btnSubmit">
                    <span>Entrar</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <!-- Link para cadastro de nova conta -->
            <p class="text-center text-secondary-fs mt-4 mb-0" style="font-size: 0.9rem;">
                Não tem uma conta?
                <a th:href="@{/cadastro}" class="text-primary fw-semibold text-decoration-none">Criar conta</a>
            </p>
        </div>
    </div>

    <!-- Script de validação client-side para resposta instantânea ao usuário -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            const email = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!email || !pass) {
                // Deixa o form enviar para disparar o failure handler ou alerta
            }
        });
    </script>
</body>
</html>
